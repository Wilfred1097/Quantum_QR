<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum QR - Modern QR Code Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- qrious Library for modern canvas/image QR generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(129, 140, 248, 0.6);
        }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between py-6 px-4 sm:px-6 lg:px-8">

    <header class="max-w-6xl mx-auto w-full flex justify-between items-center mb-8">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-qrcode text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">Quantum QR</h1>
                <p class="text-xs text-slate-400">Next-Gen Custom QR Generator</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="livePreviewToggle" class="sr-only peer" checked>
                <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                <span class="ml-2 text-xs font-medium text-slate-300">Live Preview</span>
            </label>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start mb-auto">
        
        <!-- Left Column: Input Form & Tabs (7 cols) -->
        <section class="lg:col-span-7 glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
            <div class="flex border-b border-slate-700/60 pb-4 mb-6 space-x-2 overflow-x-auto">
                <button onclick="switchTab('text')" id="tab-text" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-semibold transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30 whitespace-nowrap">
                    <i class="fa-solid fa-link mr-2"></i>Text / URL
                </button>
                <button onclick="switchTab('wifi')" id="tab-wifi" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-slate-800/50 whitespace-nowrap">
                    <i class="fa-solid fa-wifi mr-2"></i>Wi-Fi
                </button>
                <button onclick="switchTab('vcard')" id="tab-vcard" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-slate-800/50 whitespace-nowrap">
                    <i class="fa-solid fa-address-card mr-2"></i>vCard
                </button>
            </div>

            <div id="form-container">
                <!-- Text / URL Form -->
                <div id="content-text" class="tab-content space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Website URL or Text Content</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                                <i class="fa-solid fa-globe"></i>
                            </span>
                            <textarea id="input-text" rows="4" class="glass-input w-full rounded-2xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="https://example.com or custom message...">https://wilfred1097.github.io/qr-generator/</textarea>
                        </div>
                    </div>
                </div>

                <!-- Wi-Fi Form -->
                <div id="content-wifi" class="tab-content space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Network SSID (Name)</label>
                        <input type="text" id="wifi-ssid" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="MyHomeWiFi">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Encryption Type</label>
                            <select id="wifi-type" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none transition-all">
                                <option value="WPA" class="bg-slate-900 text-slate-100">WPA/WPA2</option>
                                <option value="WEP" class="bg-slate-900 text-slate-100">WEP</option>
                                <option value="nopass" class="bg-slate-900 text-slate-100">No Encryption</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                            <input type="password" id="wifi-pass" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="Network Password">
                        </div>
                    </div>
                </div>

                <!-- vCard Form -->
                <div id="content-vcard" class="tab-content space-y-4 hidden">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">First Name</label>
                            <input type="text" id="vcard-fn" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="Wilfredo">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Last Name</label>
                            <input type="text" id="vcard-ln" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="Catalan">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Phone Number</label>
                            <input type="tel" id="vcard-phone" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="+1234567890">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                            <input type="email" id="vcard-email" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="wilfred@example.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Organization / Company</label>
                        <input type="text" id="vcard-org" class="glass-input w-full rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="Quantum Tech">
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-700/60 grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Foreground Color</label>
                    <div class="flex items-center space-x-2">
                        <input type="color" id="qrColor" value="#0f172a" class="w-10 h-10 rounded-xl bg-transparent cursor-pointer border-0">
                        <span id="qrColorHex" class="text-xs font-mono text-slate-300">#0f172a</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Background Color</label>
                    <div class="flex items-center space-x-2">
                        <input type="color" id="qrBgColor" value="#ffffff" class="w-10 h-10 rounded-xl bg-transparent cursor-pointer border-0">
                        <span id="qrBgColorHex" class="text-xs font-mono text-slate-300">#ffffff</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Resolution Size</label>
                    <select id="qrSize" class="glass-input w-full rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none">
                        <option value="200" class="bg-slate-900">200 x 200 px</option>
                        <option value="300" selected class="bg-slate-900">300 x 300 px</option>
                        <option value="500" class="bg-slate-900">500 x 500 px</option>
                        <option value="1000" class="bg-slate-900">1000 x 1000 px (HD)</option>
                    </select>
                </div>
            </div>

            <div class="mt-8">
                <button id="generateBtn" onclick="generateQRCode()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold shadow-xl shadow-indigo-600/25 transition-all flex items-center justify-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate QR Code</span>
                </button>
            </div>
        </section>

        <!-- Right Column: QR Code Preview & Download Card (5 cols) -->
        <section class="lg:col-span-5 glass-card rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center text-center">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-6">Generated QR Code</h2>
            
            <div class="relative group p-4 bg-white rounded-3xl shadow-2xl mb-6 transition-transform duration-300 hover:scale-[1.02]">
                <!-- Canvas rendered QR code container -->
                <canvas id="qrCanvas" class="rounded-2xl max-w-full h-auto block"></canvas>
            </div>

            <div class="text-xs text-slate-400 mb-6 flex items-center justify-center space-x-1">
                <i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i>
                <span>Generated securely in-browser (Client-side)</span>
            </div>

            <div class="grid grid-cols-2 gap-3 w-full">
                <button onclick="downloadQR('png')" class="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm font-medium transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-download text-indigo-400"></i>
                    <span>PNG</span>
                </button>
                <button onclick="downloadQR('jpeg')" class="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm font-medium transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-file-image text-purple-400"></i>
                    <span>JPEG</span>
                </button>
            </div>
            <button onclick="copyQRImage()" class="mt-3 w-full py-3 px-4 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700/80 text-white text-sm font-medium transition-all flex items-center justify-center space-x-2">
                <i class="fa-solid fa-clipboard text-emerald-400"></i>
                <span>Copy QR to Clipboard</span>
            </button>
        </section>

    </main>

    <footer class="max-w-6xl mx-auto w-full text-center text-xs text-slate-500 mt-8 pt-4 border-t border-slate-800">
        <p>Quantum QR Code Generator • Designed with Glassmorphism & Tailwind CSS</p>
    </footer>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 text-slate-100 px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg" class="text-sm font-medium">Action completed successfully!</span>
    </div>

    <script>
        let currentTab = 'text';
        let qr;

        window.addEventListener('DOMContentLoaded', () => {
            // Initialize QR instance
            qr = new QRious({
                element: document.getElementById('qrCanvas'),
                size: 300,
                value: 'https://wilfred1097.github.io/qr-generator/',
                level: 'H',
                background: '#ffffff',
                foreground: '#0f172a'
            });

            // Bind live preview events
            const inputs = document.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    if (document.getElementById('livePreviewToggle').checked) {
                        generateQRCode();
                    }
                });
                input.addEventListener('change', () => {
                    if (document.getElementById('livePreviewToggle').checked) {
                        generateQRCode();
                    }
                });
            });

            // Color picker text sync
            document.getElementById('qrColor').addEventListener('input', (e) => {
                document.getElementById('qrColorHex').innerText = e.target.value;
                if(document.getElementById('livePreviewToggle').checked) generateQRCode();
            });
            document.getElementById('qrBgColor').addEventListener('input', (e) => {
                document.getElementById('qrBgColorHex').innerText = e.target.value;
                if(document.getElementById('livePreviewToggle').checked) generateQRCode();
            });

            // Initial generation
            generateQRCode();
        });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2.5 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-slate-800/50 whitespace-nowrap";
            });
            document.getElementById(`tab-${tab}`).className = "tab-btn px-4 py-2.5 rounded-xl text-sm font-semibold transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30 whitespace-nowrap";

            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');

            if(document.getElementById('livePreviewToggle').checked) {
                generateQRCode();
            }
        }

        function getQRCodeData() {
            if (currentTab === 'text') {
                return document.getElementById('input-text').value || 'https://wilfred1097.github.io/qr-generator/';
            } else if (currentTab === 'wifi') {
                const ssid = document.getElementById('wifi-ssid').value;
                const type = document.getElementById('wifi-type').value;
                const pass = document.getElementById('wifi-pass').value;
                if (!ssid) return 'WIFI:S:MyNetwork;T:WPA;P:password;;';
                return `WIFI:S:${ssid};T:${type};P:${pass};;`;
            } else if (currentTab === 'vcard') {
                const fn = document.getElementById('vcard-fn').value;
                const ln = document.getElementById('vcard-ln').value;
                const phone = document.getElementById('vcard-phone').value;
                const email = document.getElementById('vcard-email').value;
                const org = document.getElementById('vcard-org').value;
                
                return `BEGIN:VCARD\nVERSION:3.0\nN:${ln};${fn};;;\nFN:${fn} ${ln}\nORG:${org}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
            }
            return 'https://wilfred1097.github.io/qr-generator/';
        }

        function generateQRCode() {
            const data = getQRCodeData();
            const fgColor = document.getElementById('qrColor').value;
            const bgColor = document.getElementById('qrBgColor').value;
            const size = parseInt(document.getElementById('qrSize').value);

            qr.set({
                value: data,
                size: size,
                foreground: fgColor,
                background: bgColor
            });
        }

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');

            msg.innerText = message;
            if (isSuccess) {
                icon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else {
                icon.className = "fa-solid fa-circle-exclamation text-rose-400 text-lg";
            }

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        function downloadQR(format) {
            generateQRCode(); // Ensure correct size & options
            const canvas = document.getElementById('qrCanvas');
            let imageType = format === 'jpeg' ? 'image/jpeg' : 'image/png';
            
            // If high res requested, temporarily scale canvas if needed or qrious handles size natively
            const link = document.createElement('a');
            link.download = `quantum-qr-code.${format}`;
            link.href = canvas.toDataURL(imageType, 1.0);
            link.click();
            showToast(`QR Code successfully downloaded as ${format.toUpperCase()}!`);
        }

        function copyQRImage() {
            generateQRCode();
            const canvas = document.getElementById('qrCanvas');
            
            if (!navigator.clipboard || !window.ClipboardItem) {
                showToast('Clipboard API not fully supported in this browser sandbox.', false);
                return;
            }

            canvas.toBlob(blob => {
                try {
                    const item = new ClipboardItem({ 'image/png': blob });
                    navigator.clipboard.write([item]).then(() => {
                        showToast('QR Code copied to clipboard!');
                    }).catch(err => {
                        showToast('Failed to copy QR code image.', false);
                    });
                } catch (e) {
                    showToast('Could not copy image to clipboard.', false);
                }
            });
        }
    </script>
</body>
</html>
